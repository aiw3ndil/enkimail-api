default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: enkimail_api_development
  # host: localhost
  # username: postgres
  # password: password

test:
  <<: *default
  database: enkimail_api_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
