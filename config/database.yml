default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST") { "db" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "password" } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: enkimail_api_development

test:
  <<: *default
  database: enkimail_api_test

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") { "enkimail_production" } %>
  # Alternatively, if you prefer using a single URL:
  # url: <%= ENV["DATABASE_URL"] %>
