default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Individual variables as fallback
  host: <%= ENV.fetch("DB_HOST") { "db" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "postgres" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "password" } %>

development:
  <<: *default
  database: enkimail_api_development

test:
  <<: *default
  database: enkimail_api_test

production:
  <<: *default
  # DATABASE_URL overrides individual settings if present
  url: <%= ENV["DATABASE_URL"] %>
  database: <%= ENV.fetch("DB_NAME") { "enkimail_production" } %>
