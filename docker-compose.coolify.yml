services:
  # Aplicación Rails
  web:
    build: .
    command: bundle exec rails server -b 0.0.0.0 -p 3001
    environment:
      SMTP_ADDRESS: postfix
      SMTP_PORT: 25
      SMTP_DOMAIN: enkimail.com
      TZ: Europe/Helsinki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Sidekiq
  sidekiq:
    build: .
    command: bundle exec sidekiq
    environment:
      SMTP_ADDRESS: postfix
      SMTP_PORT: 25
      SMTP_DOMAIN: enkimail.com
      TZ: Europe/Helsinki

  # Servidor de correo Postfix
postfix:
    image: mwader/postfix-relay
    networks:
      - default
    environment:
      POSTFIX_myhostname: mail.enkimail.com
      POSTFIX_mynetworks: 0.0.0.0/0
      POSTFIX_smtpd_relay_restrictions: permit
    restart: always

networks:
  default:
    external: false

# Coolify gestionará los volúmenes definidos aquí.
volumes:
  postfix_queue: