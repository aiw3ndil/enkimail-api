services:
  # Aplicación Rails
  web:
    build: .
    command: bundle exec rails server -b 0.0.0.0 -p 3001
    networks:
      - enkimail-net
    environment:
      SMTP_ADDRESS: postfix
      SMTP_PORT: 25
      SMTP_DOMAIN: enkimail.com
      TZ: Europe/Helsinki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Sidekiq
  sidekiq:
    build: .
    command: bundle exec sidekiq
    networks:
      - enkimail-net
    environment:
      SMTP_ADDRESS: postfix
      SMTP_PORT: 25
      SMTP_DOMAIN: enkimail.com
      TZ: Europe/Helsinki

  # Servidor de correo Postfix
  postfix:
    image: mwader/postfix-relay
    container_name: postfix
    networks:
      - enkimail-net
    environment:
      POSTFIX_myhostname: mail.enkimail.com
      POSTFIX_mynetworks: 0.0.0.0/0
      POSTFIX_smtpd_relay_restrictions: permit
    volumes:
      - postfix_queue:/var/spool/postfix
    restart: always

networks:
  enkimail-net:
    driver: bridge

volumes:
  postfix_queue: