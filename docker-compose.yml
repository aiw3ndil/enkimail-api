services:
  # Aplicación Rails
  web:
    build: .
    container_name: enkimail-app
    command: /usr/bin/entrypoint.sh rails s -p 3001 -b '0.0.0.0'
    volumes:
      - .:/app
    ports:
      - "3001:3001"
    depends_on:
      - db
      - redis
    environment:
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgres://postgres:password@db:5432/enkimail_development
      TZ: Europe/Helsinki

  # Sidekiq
  sidekiq:
    build: .
    container_name: enkimail-sidekiq
    command: bundle exec sidekiq
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgres://postgres:password@db:5432/enkimail_development
      TZ: Europe/Helsinki

  # Mailpit
  mailpit:
    image: axllent/mailpit
    container_name: enkimail-mailpit
    ports:
      - "8025:8025"
    environment:
      MP_UI_AUTH: admin:805473
      TZ: Europe/Helsinki
    restart: always

volumes:
  postgres_data:
